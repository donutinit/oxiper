[package]
name = "oxiper"
version = "0.2.1"
edition = "2024"
description = "Animated terminal wallpapers, oxidized: bonsai, matrix rain, fire, nyan cat, an aquarium and more"
license = "GPL-3.0-only"
repository = "https://github.com/donutinit/oxiper"
readme = "README.md"
keywords = ["terminal", "screensaver", "ascii-art", "animation", "wallpaper"]
categories = ["command-line-utilities"]

[dependencies]
clap = { version = "4.6", features = ["derive"] }
clap_complete = "4.6"
fastrand = "2.5"
libc = "0.2"
toml = { version = "1.1", default-features = false, features = ["parse", "display", "serde"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
